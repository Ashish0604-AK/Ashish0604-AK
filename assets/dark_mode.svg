<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
    <style>

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor {
            fill: #16ed3a;
            animation: blink 1s infinite;
        }
        @keyframes pulse {
            0% { fill: #3fb950; opacity: 1; }
            50% { fill: #2ea043; opacity: 0.3; }
            100% { fill: #3fb950; opacity: 1; }
        }

        .online-dot {
            fill: #3fb950;
            animation: pulse 2s infinite ease-in-out;
        }
        

        @font-face {
            font-family: 'ConsolasFallback';
            src: local('Consolas'), local('Consolas Bold');
            font-display: swap;
            -webkit-size-adjust: 109%;
            size-adjust: 109%;
        }

        .bg { fill: #0d1117; rx: 6px; }
        .text { font-family: 'ConsolasFallback', Consolas, monospace; font-size: 11px; white-space: pre; }
        .ascii { fill: #14f01f; font-weight: bold; }
        .user_ascii { fill: #14f01f;  }
        .label { fill: #ff7b72; font-weight: bold; }
        .sublabel { fill: #05f812; font-weight: bold; }
        .dots { fill: #484f58; }
        .value { fill: #cae8ff; }
        .orange { fill: #ffa657; }
        .green { fill: #7ee787; }
        .red { fill: #ff7b72; }
    </style>
    
